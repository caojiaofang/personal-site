# 个人网站入口统一跳转到正式域名，其他域名的路由保持独立。
server {
    listen 80;
    listen [::]:80;
    server_name www.zf-yun.cn 47.251.103.11;
    return 301 https://www.zf-yun.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zf-yun.cn;

    ssl_certificate /etc/nginx/cert/www.zf-yun.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/cert/www.zf-yun.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:personal_site_SSL:1m;
    ssl_session_timeout 10m;

    root /etc/nginx/html/personal-site;
    index index.html;
    charset utf-8;
    server_tokens off;
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ~ /\. {
        deny all;
    }
}
